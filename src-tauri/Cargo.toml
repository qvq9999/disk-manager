[package]
name = "app"
version = "1.3.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
walkdir = "2"
trash = "3"
winreg = "0.52"
base64 = "0.22"
encoding_rs = "0.8"
pinyin = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
tauri-plugin-updater = "2.14.0"
# AI 请求走 Rust 侧：绕过 CORS、Key 不出主进程、可统一超时与错误文案。
# 0.13.5 已在依赖树中（tauri-plugin-updater 引入），features 与它保持一致，不引入新的下载。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
